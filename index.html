<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Grid - Cidade 3D</title>
    <meta name="description" content="Modulo de renderizacao 3D da cidade para a simulacao Smart Grid FECART 2026">
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <!-- Toggle Button -->
        <button id="toggle-panel-btn" class="glass-btn icon-btn" aria-label="Toggle Control Panel">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
        </button>

        <!-- Control Panel -->
        <div id="control-panel" class="glass-panel">
            <div class="panel-header">
                <h2>Smart Grid <span>FECART 2026</span></h2>
                <p>Centro de Controle de Energia</p>
            </div>
            
            <div class="panel-content">
                <div class="control-group">
                    <h3>Simulação de Rede</h3>
                    <button id="btn-overload" class="control-btn warning">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
                        Simular Sobrecarga
                    </button>
                    <button id="btn-night" class="control-btn info">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                        Forçar Noite / Clima
                    </button>
                    <button id="btn-failure" class="control-btn danger">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                        Falha na Usina (Blackout)
                    </button>
                </div>
                
                <div class="control-group">
                    <h3>Sistema</h3>
                    <button id="btn-reset-cam" class="control-btn info">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
                        Visão Geral (Reset Câmera)
                    </button>
                    <button id="btn-reset" class="control-btn success">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                        Resetar Cidade
                    </button>
                </div>

                <div class="info-card">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    <p><strong>Dicas:</strong><br>
                    • Dê <strong>duplo clique</strong> em qualquer prédio ou quadra para focar a câmera.<br>
                    • Clique em um poste ou cabo para simular corte de energia local.</p>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
